name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run audit:security
      - run: npm run typecheck
      - run: npm run lint
      - name: Prepare isolated integration database
        run: node scripts/run-ci-integration.mjs prepare
      - name: Run every test with no skips
        run: node scripts/run-ci-integration.mjs test
      - name: Remove isolated integration database
        if: always()
        run: node scripts/run-ci-integration.mjs stop
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run -c wrangler.jsonc

  deploy:
    name: Deploy Cloudflare Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: 7c1d945e149fc6fad2124176124d8f33
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run audit:security
      - name: Verify Production target
        run: node scripts/prepare-production-notifications.mjs assert
      - name: Prepare Production Push runtime secrets
        run: node scripts/prepare-production-notifications.mjs push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - run: npx opennextjs-cloudflare build
      - name: Verify compiled Production database target
        run: |
          grep --recursive --quiet --binary-files=text "rqizfiayvcbozlzuvbok" .open-next
          ! grep --recursive --quiet --binary-files=text "sxvkhzhqtrpxgzumsswl" .open-next
      - name: Apply Production migrations
        run: node scripts/prepare-production-notifications.mjs migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npx opennextjs-cloudflare populateCache remote --config wrangler.jsonc
      - run: npx wrangler deploy -c wrangler.jsonc --keep-vars --secrets-file .env.production-worker-secrets.json
      - name: Remove temporary Production runtime secret file
        if: always()
        run: node scripts/prepare-production-notifications.mjs cleanup
