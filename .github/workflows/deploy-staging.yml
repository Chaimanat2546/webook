name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify Login History database policies and filters
        shell: bash
        run: |
          docker run --detach --name webook-login-history-tests --network none --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm --force webook-login-history-tests > /dev/null 2>&1' EXIT
          for attempt in $(seq 1 60); do
            if docker exec webook-login-history-tests pg_isready -U postgres > /dev/null 2>&1; then
              node scripts/test-login-history-db.mjs
              exit 0
            fi
            sleep 1
          done
          echo "Isolated Login History database did not become ready" >&2
          exit 1
      - name: Prepare isolated integration database
        run: node scripts/run-ci-integration.mjs prepare
      - name: Run every test with no skips
        run: node scripts/run-ci-integration.mjs test
      - name: Remove isolated integration database
        if: always()
        run: node scripts/run-ci-integration.mjs stop
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run -c wrangler.staging.jsonc
      - name: Smoke test compiled Staging Worker locally
        shell: bash
        run: |
          node node_modules/wrangler/bin/wrangler.js dev --local -c wrangler.staging.jsonc --ip 127.0.0.1 --port 8793 > "$RUNNER_TEMP/webook-staging-smoke.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8793/login > /dev/null
          node --input-type=module <<'NODE'
          for (const [path, expected] of [["/login", 200], ["/admin/dashboard", 307], ["/api/notifications", 401]]) {
            const response = await fetch(`http://127.0.0.1:8793${path}`, { redirect: "manual", signal: AbortSignal.timeout(10000) });
            if (response.status !== expected) throw new Error(`Compiled Staging Worker ${path}: ${response.status}, expected ${expected}`);
            await response.body?.cancel();
            console.log(`${path}: ${response.status}`);
          }
          NODE

  deploy:
    name: Apply migration and deploy Staging Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: node scripts/run-staging-supabase-migrations.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Prepare Staging Push runtime secrets
        run: node scripts/prepare-staging-push-secrets.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - run: npm run deploy:cf:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: grep --recursive --quiet --binary-files=text "sxvkhzhqtrpxgzumsswl" .open-next
      - run: "! grep --recursive --quiet --binary-files=text \"rqizfiayvcbozlzuvbok\" .open-next"
      - name: Remove temporary Staging runtime secret file
        if: always()
        run: node scripts/prepare-staging-push-secrets.mjs cleanup
